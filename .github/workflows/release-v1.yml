name: build-and-publish-v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.yml'
      - 'desktop/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: '1.0.1'

jobs:
  windows:
    name: Windows ${{ matrix.channel }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        channel: [modern, legacy]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packaging dependencies
        shell: pwsh
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Set app version
        shell: pwsh
        run: npm version "$env:APP_VERSION" --no-git-tag-version --allow-same-version
      - name: Build Windows package
        shell: pwsh
        run: |
          if ("${{ matrix.channel }}" -eq "legacy") { npm run dist:win:legacy }
          else { npm run dist:win }
      - name: Normalize public filename
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $src = Get-ChildItem -Path dist -Filter *.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $src) { throw "No Windows installer was produced" }
          if ("${{ matrix.channel }}" -eq "legacy") {
            $name = "Incheon-Academy-OS-Windows-Legacy-7-8-8.1-v$env:APP_VERSION-x64.exe"
          } else {
            $name = "Incheon-Academy-OS-Windows-10-11-v$env:APP_VERSION-x64.exe"
          }
          Copy-Item $src.FullName (Join-Path release $name)
          Get-ChildItem release
      - uses: actions/upload-artifact@v4
        with:
          name: public-windows-${{ matrix.channel }}
          path: desktop/release/*.exe
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS ${{ matrix.channel }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        channel: [modern, mojave]
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packaging dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm install --no-audit --no-fund
      - name: Set app version
        run: npm version "$APP_VERSION" --no-git-tag-version --allow-same-version
      - name: Build macOS package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          if [ "${{ matrix.channel }}" = "mojave" ]; then npm run dist:mac:mojave; else npm run dist:mac; fi
      - name: Normalize public filename
        run: |
          mkdir -p release
          src="$(find dist -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          test -n "$src"
          if [ "${{ matrix.channel }}" = "mojave" ]; then
            name="Incheon-Academy-OS-macOS-Mojave-10.14.6-v${APP_VERSION}-x64.dmg"
          else
            name="Incheon-Academy-OS-macOS-13-plus-v${APP_VERSION}-universal.dmg"
          fi
          cp "$src" "release/$name"
          ls -lh release
      - uses: actions/upload-artifact@v4
        with:
          name: public-macos-${{ matrix.channel }}
          path: desktop/release/*.dmg
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [windows, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: public-*
          merge-multiple: true
          path: release
      - name: Verify release payload
        run: |
          set -euo pipefail
          ls -lh release
          count="$(find release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' \) | wc -l | tr -d ' ')"
          test "$count" = "4"
          cd release
          sha256sum *.exe *.dmg | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # 실용음악분과 OS v1.0.1

          공식 다운로드센터에서 제공하는 데스크톱 설치형 앱 v1.0.1입니다.

          ## 이번 변경
          - 설치 앱 표시명을 `실용음악분과 OS`로 변경
          - 내부 App ID `kr.or.incheonacademy.unionos`는 그대로 유지
          - Production 웹 OS와 동일한 계정·권한·데이터를 계속 사용

          ## 포함 파일
          - Windows 10/11 x64
          - Windows 7/8/8.1 Legacy x64
          - macOS 13+ Universal
          - macOS Mojave 10.14.6 Intel x64
          - SHA256SUMS.txt

          ## 보안 및 호환성 안내
          이 v1.0.1 데스크톱 설치파일은 코드서명 및 Apple notarization 전 배포본이므로 Windows SmartScreen 또는 macOS Gatekeeper 경고가 표시될 수 있습니다. Legacy 채널은 실행 호환성을 위한 채널이며 최신 운영체제와 동일한 보안 수준을 의미하지 않습니다.

          제품 기능과 회원 데이터는 Production HTTPS 서버에서 제공되며 앱 파일에 서버 비밀키나 회원 데이터가 포함되지 않습니다.

          Validated product source: `12091139ce07640650795160476f0435bf22a84f`
          EOF
      - name: Publish v1.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${APP_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --title "실용음악분과 OS v${APP_VERSION}" --notes-file RELEASE_NOTES.md
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "실용음악분과 OS v${APP_VERSION}" --notes-file RELEASE_NOTES.md
          fi
