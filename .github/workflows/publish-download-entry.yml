name: publish-download-center-entry-file

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-download-entry.yml'
      - '00_실용음악분과_OS_공식다운로드센터.html'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-download-entry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate download-center entry file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate portable HTML entry file
        run: |
          set -euo pipefail
          source='00_실용음악분과_OS_공식다운로드센터.html'
          test -f "$source"
          grep -q 'https://incheon-academy-union-os-web.vercel.app/download' "$source"
          grep -q 'app-icon.svg' "$source"
          grep -q '실용음악분과(임시) OS' "$source"
          grep -q '인천광역시학원연합회' "$source"

  publish:
    name: Publish entry file to v1.0.1 Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload as downloadable Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source='00_실용음악분과_OS_공식다운로드센터.html'
          target='00_Practical-Music-OS_Download-Center.html'
          cp "$source" "$target"
          gh release upload v1.0.1 "$target" --clobber
          gh release delete-asset v1.0.1 '00_._OS_.html' -y || true
          gh release view v1.0.1 --json assets --jq '.assets[].name' | grep -Fx "$target"
